name: Android CI — Lectures

on:
  push:
    branches: [ test, main ]
  pull_request:
    branches: [ test, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || \
            sdkmanager "platforms;android-36" > /dev/null

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin (debug)
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectures-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Android CI — Lectures"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo ""
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "APK built: **$SIZE**"
            else
              echo "APK: not produced"
            fi
          } >> $GITHUB_STEP_SUMMARY
