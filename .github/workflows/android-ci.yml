name: Android CI — Lectures

on:
  push:
    branches: [ test, main ]
  pull_request:
    branches: [ test, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest runner ships the Android SDK preinstalled.
      # Do NOT use android-actions/setup-android here: its default
      # `packages: tools` no longer exists in cmdline-tools >= 12 and the
      # action fails with "Failed to find package 'tools'".
      - name: Locate preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "SDK at: $SDK"
          ls "$SDK" || true
          echo "--- installed platforms ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

      - name: Install Android platform 36
        run: |
          SDK="$ANDROID_SDK_ROOT"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-36" || "$SM" "platforms;android-35" || true
          echo "--- platforms now ---"
          ls "$SDK/platforms"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # debug.keystore is gitignored, so it is absent on a fresh checkout and
      # :app:validateSigningDebug fails with "Keystore file ... not found".
      # Generate a throwaway debug keystore for CI.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la debug.keystore

      - name: Compile Kotlin (debug)
        run: ./gradlew compileDebugKotlin --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectures-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Android CI — Lectures"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo ""
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "APK built: **$SIZE**"
            else
              echo "APK: not produced"
            fi
          } >> $GITHUB_STEP_SUMMARY
