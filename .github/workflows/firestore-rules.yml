name: Firestore rules

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Validate personal and public access rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/firestore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test against an isolated demo project
        run: npm run test:emulator
        env:
          JAVA_TOOL_OPTIONS: -Xmx512m
